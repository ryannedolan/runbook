name: Build and deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - run: flutter pub get

      # Convert data/dogs/*.yaml → assets/dogs/*.json before tests and
      # build, so the deployed site always reflects the YAML source of
      # truth even if a contributor forgot to regenerate locally.
      - run: dart run tool/build_dog_assets.dart

      - run: flutter test

      - run: flutter build web --release --base-href=/runbook/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
